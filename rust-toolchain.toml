# Pinned toolchain for reproducible builds.
#
# The exact verified toolchain for this repository is `rustc 1.98.1
# (48a229cea 2026-09-01)` with `cargo 1.98.1 (797e8a9bc 2026-08-05)`.
# Keep `channel` and the CI action version aligned with this verified release.
# `rust-version` in the workspace `Cargo.toml` is the MSRV contract.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
